<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">

```
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Hangar Play | El cielo</title>

<meta
    name="description"
    content="Hangar Play Radio — El cielo, el clima y la hora local."
>

<link
    rel="stylesheet"
    href="footer.css"
>
```

</head>

<body>

```
<main
    id="hangar-footer"
    class="hangar-footer weather-clear"
>

    <!-- =========================================
         FONDO ATMOSFÉRICO
    ========================================== -->

    <div
        class="weather-background"
        aria-hidden="true"
    ></div>


    <!-- =========================================
         CAPA DE CONTRASTE
    ========================================== -->

    <div
        class="weather-overlay"
        aria-hidden="true"
    ></div>


    <!-- =========================================
         CONTENIDO PRINCIPAL
    ========================================== -->

    <section class="weather-content">

        <!-- LOCALIDAD -->

        <div class="location-section">

            <div class="location-label">

                <span
                    class="location-icon"
                    aria-hidden="true"
                >
                    ⌖
                </span>

                <span id="location-name">
                    MONTEVIDEO, URUGUAY
                </span>

            </div>


            <button
                id="change-location"
                class="location-button"
                type="button"
            >

                <span aria-hidden="true">
                    ⌕
                </span>

                Cambiar localidad

            </button>

        </div>


        <!-- =====================================
             INFORMACIÓN METEOROLÓGICA
        ====================================== -->

        <div class="weather-section">

            <div
                id="weather-icon"
                class="weather-icon"
                aria-hidden="true"
            >
                ☀️
            </div>


            <div class="weather-data">

                <div
                    id="weather-condition"
                    class="weather-condition"
                >
                    DESPEJADO
                </div>


                <div
                    id="temperature"
                    class="temperature"
                >
                    -- °C
                </div>

            </div>

        </div>


        <!-- =====================================
             HORA LOCAL
        ====================================== -->

        <div class="time-section">

            <div class="time-label">
                HORA LOCAL
            </div>


            <div
                id="local-time"
                class="local-time"
            >
                --:--
            </div>


            <div
                id="local-date"
                class="local-date"
            >
                --
            </div>

        </div>

    </section>


    <!-- =========================================
         BUSCADOR DE LOCALIDAD
    ========================================== -->

    <section
        id="location-search"
        class="location-search hidden"
        aria-hidden="true"
    >

        <div class="search-box">

            <div class="search-header">

                <h2>
                    Buscar localidad
                </h2>


                <button
                    id="close-search"
                    class="close-search"
                    type="button"
                    aria-label="Cerrar buscador"
                >
                    ×
                </button>

            </div>


            <label
                for="location-input"
                class="search-label"
            >
                Escribí una ciudad o localidad
            </label>


            <div class="search-input-wrapper">

                <span
                    class="search-icon"
                    aria-hidden="true"
                >
                    ⌕
                </span>


                <input
                    id="location-input"
                    type="text"
                    autocomplete="off"
                    placeholder="Ej.: Florida, Uruguay"
                >

            </div>


            <div
                id="location-results"
                class="location-results"
            ></div>

        </div>

    </section>


    <!-- =========================================
         REDES Y CONTACTO
    ========================================== -->

    <footer class="contact-section">

        <div class="social-links">

            <!-- Instagram: visual, sin enlace activo -->

            <span
                class="social-link social-link-disabled"
                id="instagram-link"
                aria-label="Instagram"
                aria-disabled="true"
            >
                <span
                    class="social-icon"
                    aria-hidden="true"
                >
                    ◎
                </span>

                <span class="social-name">
                    Instagram
                </span>
            </span>


            <!-- Facebook: visual, sin enlace activo -->

            <span
                class="social-link social-link-disabled"
                id="facebook-link"
                aria-label="Facebook"
                aria-disabled="true"
            >
                <span
                    class="social-icon"
                    aria-hidden="true"
                >
                    f
                </span>

                <span class="social-name">
                    Facebook
                </span>
            </span>


            <!-- WhatsApp: visual, sin enlace activo -->

            <span
                class="social-link social-link-disabled"
                id="whatsapp-link"
                aria-label="WhatsApp"
                aria-disabled="true"
            >
                <span
                    class="social-icon"
                    aria-hidden="true"
                >
                    ◉
                </span>

                <span class="social-name">
                    WhatsApp
                </span>
            </span>

        </div>


        <!-- CORREO ACTIVO -->

        <a
            href="mailto:hangarplayradio@gmail.com"
            class="email-link"
        >
            hangarplayradio@gmail.com
        </a>


        <!-- IDENTIDAD -->

        <div class="footer-brand">
            HANGAR PLAY
        </div>


        <div class="footer-slogan">
            SURCANDO EL AIRE DE LOS TIEMPOS
        </div>

    </footer>

</main>


<!-- =========================================
     JAVASCRIPT DEL PIE
========================================== -->

<script src="footer.js"></script>
```

</body>

</html>
