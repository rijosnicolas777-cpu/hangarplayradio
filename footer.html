<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangar Play Radio — Footer Clima</title>
    <style>
        /* =========================================================
        RESET ABSOLUTO PARA GOOGLE SITES (Elimina bordes y scroll innecesario)
        ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            background-color: #05080c !important;
            color: #ffffff;
            font-family: "Segoe UI", Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* =========================================================
        CONTENEDOR PRINCIPAL DEL FOOTER
        ========================================================= */
        .hangar-footer {
            position: relative;
            width: 100%;
            min-height: 680px;
            overflow: hidden;
            isolation: isolate;
            background: #05080c;
        }

        /* =========================================================
        FONDO ATMOSFÉRICO CON LOOP CONTINUO (Reemplaza al GIF)
        ========================================================= */
        .weather-background {
            position: absolute;
            inset: -2%;
            z-index: 0;
            background-color: #05080c;
            background-image: url("img/cielo-despejado.jpg");
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            
            /* Animación suave tipo video en bucle */
            animation: atmosphericLoop 25s ease-in-out infinite alternate;
            
            transition: background-image 1.2s ease-in-out, filter 1.2s ease-in-out;
        }

        @keyframes atmosphericLoop {
            0% { transform: scale(1.0) translate(0px, 0px); }
            50% { transform: scale(1.06) translate(-10px, -5px); }
            100% { transform: scale(1.03) translate(8px, 4px); }
        }

        /* ESTADOS DE CLIMA */
        .hangar-footer.weather-clear .weather-background { background-image: url("img/cielo-despejado.jpg"); filter: brightness(1.05) saturate(1.05); }
        .hangar-footer.weather-cloudy .weather-background { background-image: url("img/cielo-nublado.jpg"); filter: brightness(0.85) saturate(0.85); }
        .hangar-footer.weather-rain .weather-background { background-image: url("img/cielo-lluvia.jpg"); filter: brightness(0.70) saturate(0.80); }
        .hangar-footer.weather-storm .weather-background { background-image: url("img/cielo-tormenta.jpg"); filter: brightness(0.55) saturate(0.75); }
        .hangar-footer.weather-sunrise .weather-background { background-image: url("img/cielo-amanecer.jpg"); filter: brightness(1.05) saturate(1.10); }
        .hangar-footer.weather-sunset .weather-background { background-image: url("img/cielo-atardecer.jpg"); filter: brightness(0.90) saturate(1.10); }
        .hangar-footer.weather-night .weather-background { background-image: url("img/cielo-noche.jpg"); filter: brightness(0.48) saturate(0.75); }

        /* CAPA DE OSCURECIMIENTO / CONTRASTE */
        .weather-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0.30) 48%, rgba(0, 0, 0, 0.72) 100%);
        }

        .weather-overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.10), transparent 42%);
            pointer-events: none;
        }

        /* =========================================================
        CONTENIDO GENERAL DEL FOOTER
        ========================================================= */
        .weather-content {
            position: relative;
            z-index: 2;
            width: min(1100px, 92%);
            min-height: 430px;
            margin: 0 auto;
            padding: 70px 30px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* LOCALIDAD */
        .location-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 38px;
        }

        .location-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
        }

        .location-button {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 999px;
            padding: 9px 18px;
            background: rgba(0, 0, 0, 0.24);
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
        }

        .location-button:hover {
            background: rgba(0, 0, 0, 0.45);
            border-color: rgba(255, 255, 255, 0.90);
            transform: translateY(-2px);
        }

        /* INFORMACIÓN METEOROLÓGICA */
        .weather-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 40px;
        }

        .weather-icon {
            font-size: clamp(48px, 7vw, 76px);
            line-height: 1;
            filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.45));
        }

        .weather-data {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .weather-condition {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.70);
        }

        .temperature {
            margin-top: 4px;
            font-size: clamp(34px, 5vw, 56px);
            font-weight: 300;
            line-height: 1;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.70);
        }

        /* HORA LOCAL */
        .time-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-label {
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            opacity: 0.80;
        }

        .local-time {
            font-size: clamp(36px, 6vw, 64px);
            font-weight: 300;
            line-height: 1;
            letter-spacing: 0.05em;
            text-shadow: 0 3px 18px rgba(0, 0, 0, 0.75);
        }

        .local-date {
            margin-top: 10px;
            font-size: 13px;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            opacity: 0.88;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
        }

        /* REDES Y CONTACTO */
        .contact-section {
            position: relative;
            z-index: 2;
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 28px 30px 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.20);
        }

        .social-links {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 18px;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.20);
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            backdrop-filter: blur(7px);
            text-decoration: none;
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
        }

        .social-link:hover {
            background: rgba(0, 0, 0, 0.45);
            border-color: rgba(255, 255, 255, 0.90);
            transform: translateY(-2px);
        }

        .footer-brand {
            margin-top: 28px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.24em;
        }

        .footer-slogan {
            margin-top: 8px;
            font-size: 11px;
            letter-spacing: 0.18em;
            opacity: 0.72;
        }
    </style>
</head>
<body>

    <div class="hangar-footer weather-clear">
        <div class="weather-background"></div>
        <div class="weather-overlay"></div>

        <div class="weather-content">
            <div class="location-section">
                <div class="location-label"><span>📍</span> Florida, Uruguay</div>
                <button class="location-button">Cambiar Localidad</button>
            </div>

            <div class="weather-section">
                <div class="weather-icon">☀️</div>
                <div class="weather-data">
                    <span class="weather-condition">Despejado</span>
                    <span class="temperature">22°C</span>
                </div>
            </div>

            <div class="time-section">
                <div class="time-label">Hora Local</div>
                <div class="local-time">15:03</div>
                <div class="local-date">Lunes, 27 de Julio de 2026</div>
            </div>
        </div>

        <div class="contact-section">
            <div class="social-links">
                <a href="#" class="social-link">📸 Instagram</a>
                <a href="#" class="social-link">📘 Facebook</a>
                <a href="#" class="social-link">💬 WhatsApp</a>
            </div>
            <div class="footer-brand">HANGAR PLAY RADIO</div>
            <div class="footer-slogan">LA ESTACIÓN OFICIAL DE LA AVIACIÓN Y LA MÚSICA</div>
        </div>
    </div>

</body>
</html>
