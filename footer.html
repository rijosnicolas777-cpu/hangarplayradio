<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangar Play Radio — Footer Clima</title>
    <style>
        /* =========================================================
        RESET ABSOLUTO PARA GOOGLE SITES
        ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            background-color: #05080c !important;
            color: #ffffff;
            font-family: "Segoe UI", Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* =========================================================
        CONTENEDOR PRINCIPAL DEL FOOTER
        ========================================================= */
        .hangar-footer {
            position: relative;
            width: 100%;
            min-height: 680px;
            overflow: hidden;
            isolation: isolate;
            background: #05080c;
        }

        /* =========================================================
        FONDO ATMOSFÉRICO CON LOOP CONTINUO
        ========================================================= */
        .weather-background {
            position: absolute;
            inset: -2%;
            z-index: 0;
            background-color: #05080c;
            background-image: url("img/cielo-despejado.jpg");
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            
            animation: atmosphericLoop 25s ease-in-out infinite alternate;
            transition: background-image 1.2s ease-in-out, filter 1.2s ease-in-out;
        }

        @keyframes atmosphericLoop {
            0% { transform: scale(1.0) translate(0px, 0px); }
            50% { transform: scale(1.06) translate(-10px, -5px); }
            100% { transform: scale(1.03) translate(8px, 4px); }
        }

        /* ESTADOS DE CLIMA */
        .hangar-footer.weather-clear .weather-background { background-image: url("img/cielo-despejado.jpg"); filter: brightness(1.05) saturate(1.05); }
        .hangar-footer.weather-cloudy .weather-background { background-image: url("img/cielo-nublado.jpg"); filter: brightness(0.85) saturate(0.85); }
        .hangar-footer.weather-rain .weather-background { background-image: url("img/cielo-lluvia.jpg"); filter: brightness(0.70) saturate(0.80); }
        .hangar-footer.weather-storm .weather-background { background-image: url("img/cielo-tormenta.jpg"); filter: brightness(0.55) saturate(0.75); }
        .hangar-footer.weather-sunrise .weather-background { background-image: url("img/cielo-amanecer.jpg"); filter: brightness(1.05) saturate(1.10); }
        .hangar-footer.weather-sunset .weather-background { background-image: url("img/cielo-atardecer.jpg"); filter: brightness(0.90) saturate(1.10); }
        .hangar-footer.weather-night .weather-background { background-image: url("img/cielo-noche.jpg"); filter: brightness(0.48) saturate(0.75); }

        /* CAPA DE OSCURECIMIENTO / CONTRASTE */
        .weather-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0.30) 48%, rgba(0, 0, 0, 0.72) 100%);
        }

        .weather-overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.10), transparent 42%);
            pointer-events: none;
        }

        /* =========================================================
        CONTENIDO GENERAL DEL FOOTER
        ========================================================= */
        .weather-content {
            position: relative;
            z-index: 2;
            width: min(1100px, 92%);
            min-height: 430px;
            margin: 0 auto;
            padding: 70px 30px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* LOCALIDAD Y BOTÓN */
        .location-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 38px;
            position: relative;
        }

        .location-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
        }

        .location-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .location-button {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 999px;
            padding: 9px 18px;
            background: rgba(0, 0, 0, 0.24);
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
        }

        .location-button:hover {
            background: rgba(0, 0, 0, 0.45);
            border-color: rgba(255, 255, 255, 0.90);
            transform: translateY(-2px);
        }

        /* INFORMACIÓN METEOROLÓGICA */
        .weather-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 40px;
        }

        .weather-icon-container {
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.5));
        }

        .weather-icon-container svg {
            width: 100%;
            height: 100%;
        }

        .weather-data {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .weather-condition {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.70);
        }

        .temperature {
            margin-top: 4px;
            font-size: clamp(34px, 5vw, 56px);
            font-weight: 300;
            line-height: 1;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.70);
        }

        /* HORA LOCAL */
        .time-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-label {
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            opacity: 0.80;
        }

        .local-time {
            font-size: clamp(36px, 6vw, 64px);
            font-weight: 300;
            line-height: 1;
            letter-spacing: 0.05em;
            text-shadow: 0 3px 18px rgba(0, 0, 0, 0.75);
        }

        .local-date {
            margin-top: 10px;
            font-size: 13px;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            opacity: 0.88;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
        }

        /* REDES Y CONTACTO */
        .contact-section {
            position: relative;
            z-index: 2;
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 28px 30px 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.20);
        }

        .social-links {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 18px;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.20);
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            backdrop-filter: blur(7px);
            text-decoration: none;
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
        }

        .social-link svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .social-link:hover {
            background: rgba(0, 0, 0, 0.45);
            border-color: rgba(255, 255, 255, 0.90);
            transform: translateY(-2px);
        }

        .footer-email {
            margin-bottom: 16px;
            font-size: 13px;
            letter-spacing: 0.08em;
            opacity: 0.85;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .footer-email svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .footer-email a {
            color: #ffffff;
            text-decoration: underline;
        }

        .footer-brand {
            margin-top: 20px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.24em;
        }

        .footer-slogan {
            margin-top: 8px;
            font-size: 11px;
            letter-spacing: 0.18em;
            opacity: 0.72;
        }
    </style>
</head>
<body>

    <div id="footerRoot" class="hangar-footer weather-clear">
        <div class="weather-background"></div>
        <div class="weather-overlay"></div>

        <div class="weather-content">
            <div class="location-section">
                <div id="locationLabel" class="location-label"><span>📍</span> Montevideo, Uruguay</div>
                <div class="location-controls">
                    <button id="toggleLocationBtn" class="location-button">Cambiar Localidad</button>
                </div>
            </div>

            <div class="weather-section">
                <div id="weatherIconContainer" class="weather-icon-container">
                    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="32" cy="32" r="14" fill="url(#sunGrad)" />
                        <path d="M32 6V12M32 52V58M6 32H12M52 32H58M13.636 13.636L17.878 17.878M46.122 46.122L50.364 50.364M13.636 50.364L17.878 46.122M46.122 17.878L50.364 13.636" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
                        <defs>
                            <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
                                <stop offset="0%" stop-color="#FFF568" />
                                <stop offset="60%" stop-color="#FF9900" />
                                <stop offset="100%" stop-color="#FF5500" />
                            </radialGradient>
                        </defs>
                    </svg>
                </div>
                <div class="weather-data">
                    <span id="weatherCondition" class="weather-condition">Despejado</span>
                    <span id="temperature" class="temperature">--°C</span>
                </div>
            </div>

            <div class="time-section">
                <div class="time-label">Hora Local</div>
                <div id="localTime" class="local-time">--:--</div>
                <div id="localDate" class="local-date">--</div>
            </div>
        </div>

        <div class="contact-section">
            <div class="social-links">
                <a href="#" target="_blank" class="social-link">
                    <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    Instagram
                </a>
                <a href="#" target="_blank" class="social-link">
                    <svg viewBox="0 0 24 24"><path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/></svg>
                    Facebook
                </a>
                <a href="#" target="_blank" class="social-link">
                    <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                    WhatsApp
                </a>
            </div>
            <div class="footer-email">
                <svg viewBox="0 0 24 24"><path d="M12 12.713l-11.985-9.713h23.97l-11.985 9.713zm0 2.574l-12-9.725v15.438h24v-15.438l-12 9.725z"/></svg>
                <a href="mailto:hangarplayradio@gmail.com">hangarplayradio@gmail.com</a>
            </div>
            <div class="footer-brand">HANGAR PLAY RADIO</div>
            <div class="footer-slogan">SURCANDO EL CIELO DE LOS TIEMPOS</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const footerRoot = document.getElementById('footerRoot');
            const locationLabel = document.getElementById('locationLabel');
            const toggleLocationBtn = document.getElementById('toggleLocationBtn');
            const weatherIconContainer = document.getElementById('weatherIconContainer');
            const weatherCondition = document.getElementById('weatherCondition');
            const temperature = document.getElementById('temperature');
            const localTime = document.getElementById('localTime');
            const localDate = document.getElementById('localDate');

            const svgIcons = {
                clear: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="14" fill="url(#sunGrad)"/><path d="M32 6V12M32 52V58M6 32H12M52 32H58M13.636 13.636L17.878 17.878M46.122 46.122L50.364 50.364M13.636 50.364L17.878 46.122M46.122 17.878L50.364 13.636" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/><defs><radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#FFF568"/><stop offset="60%" stop-color="#FF9900"/><stop offset="100%" stop-color="#FF5500"/></radialGradient></defs></svg>`,
                cloudy: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M46 28H44.62C43.34 21.72 37.84 17 31.2 17C24.56 17 19.06 21.72 17.78 28H14C9.58 28 6 31.58 6 36C6 40.42 9.58 44 14 44H46C50.42 44 54 40.42 54 36C54 31.58 50.42 28 46 28Z" fill="url(#cloudGrad)"/><defs><linearGradient id="cloudGrad" x1="6" y1="17" x2="54" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#E0E6ED"/><stop offset="100%" stop-color="#9AA5B1"/></linearGradient></defs></svg>`,
                rain: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M46 24H44.62C43.34 17.72 37.84 13 31.2 13C24.56 13 19.06 17.72 17.78 24H14C9.58 24 6 27.58 6 32C6 36.42 9.58 40 14 40H46C50.42 40 54 36.42 54 32C54 27.58 50.42 24 46 24Z" fill="url(#rainCloud)"/><path d="M20 48L17 56M32 48L29 56M44 48L41 56" stroke="#00B4D8" stroke-width="3" stroke-linecap="round"/><defs><linearGradient id="rainCloud" x1="6" y1="13" x2="54" y2="40" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#94A3B8"/><stop offset="100%" stop-color="#475569"/></linearGradient></defs></svg>`,
                storm: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M46 22H44.62C43.34 15.72 37.84 11 31.2 11C24.56 11 19.06 15.72 17.78 22H14C9.58 22 6 25.58 6 30C6 34.42 9.58 38 14 48H46C50.42 38 54 34.42 54 30C54 25.58 50.42 22 46 22Z" fill="#334155"/><path d="M34 40L24 50H32L30 60L42 46H34L34 40Z" fill="#FACC15"/></svg>`
            };

            // Lista oficial de los 19 departamentos de Uruguay (con Montevideo al inicio como base central)
            const uruguayDepartments = [
                { name: "Montevideo, Uruguay", lat: -34.9011, lon: -56.1645 },
                { name: "Canelones, Uruguay", lat: -34.5228, lon: -56.2808 },
                { name: "Maldonado, Uruguay", lat: -34.9033, lon: -54.9536 },
                { name: "Rocha, Uruguay", lat: -34.4833, lon: -54.3333 },
                { name: "Treinta y Tres, Uruguay", lat: -33.2333, lon: -54.3833 },
                { name: "Cerro Largo, Uruguay", lat: -32.3667, lon: -54.1833 },
                { name: "Rivera, Uruguay", lat: -30.9053, lon: -55.5506 },
                { name: "Artigas, Uruguay", lat: -30.4, lon: -56.4667 },
                { name: "Salto, Uruguay", lat: -31.3833, lon: -57.9667 },
                { name: "Paysandú, Uruguay", lat: -32.3167, lon: -58.0833 },
                { name: "Río Negro, Uruguay", lat: -32.7333, lon: -58.2833 },
                { name: "Soriano, Uruguay", lat: -33.5, lon: -58.0333 },
                { name: "Colonia, Uruguay", lat: -34.4667, lon: -57.85 },
                { name: "San José, Uruguay", lat: -34.3375, lon: -56.7136 },
                { name: "Flores, Uruguay", lat: -33.55, lon: -56.7 },
                { name: "Florida, Uruguay", lat: -34.0984, lon: -56.2161 },
                { name: "Durazno, Uruguay", lat: -33.4167, lon: -55.5333 },
                { name: "Tacuarembó, Uruguay", lat: -31.7333, lon: -55.9833 },
                { name: "Lavalleja, Uruguay", lat: -34.3667, lon: -55.2333 }
            ];

            let currentIndex = 0;

            // Al hacer clic, rota al siguiente departamento de la lista
            toggleLocationBtn.addEventListener('click', () => {
                currentIndex = (currentIndex + 1) % uruguayDepartments.length;
                const dept = uruguayDepartments[currentIndex];
                fetchWeather(dept.lat, dept.lon, dept.name);
                saveUserLocation(currentIndex, dept.lat, dept.lon, dept.name);
            });

            function saveUserLocation(index, lat, lon, name) {
                try {
                    localStorage.setItem('hangar_dept_data', JSON.stringify({ index, lat, lon, name }));
                } catch (err) {}
            }

            async function fetchWeather(lat, lon, locationName) {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day&timezone=auto`);
                    const data = await res.json();
                    
                    if (data && data.current) {
                        const temp = Math.round(data.current.temperature_2m);
                        const code = data.current.weather_code;
                        const isDay = data.current.is_day;

                        locationLabel.innerHTML = `📍 ${locationName}`;
                        temperature.textContent = `${temp}°C`;

                        let condText = "Despejado";
                        let iconKey = "clear";
                        let bgClass = isDay ? "weather-clear" : "weather-night";

                        if (code >= 1 && code <= 3) {
                            condText = "Nublado";
                            iconKey = "cloudy";
                            bgClass = "weather-cloudy";
                        } else if (code >= 51 && code <= 67) {
                            condText = "Lluvia";
                            iconKey = "rain";
                            bgClass = "weather-rain";
                        } else if (code >= 95) {
                            condText = "Tormenta";
                            iconKey = "storm";
                            bgClass = "weather-storm";
                        } else if (!isDay) {
                            condText = "Noche Despejada";
                            bgClass = "weather-night";
                        }

                        weatherCondition.textContent = condText;
                        weatherIconContainer.innerHTML = svgIcons[iconKey] || svgIcons.clear;
                        footerRoot.className = `hangar-footer ${bgClass}`;
                    }
                } catch (err) {
                    console.error("Error cargando clima", err);
                }
            }

            function updateClock() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                localTime.textContent = `${hours}:${minutes}`;

                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                let dateString = now.toLocaleDateString('es-ES', options);
                dateString = dateString.charAt(0).toUpperCase() + dateString.slice(1);
                localDate.textContent = dateString;
            }

            updateClock();
            setInterval(updateClock, 1000);

            // Carga inicial: Recupera el departamento guardado en el navegador o Montevideo por defecto
            try {
                const saved = localStorage.getItem('hangar_dept_data');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    currentIndex = parsed.index;
                    fetchWeather(parsed.lat, parsed.lon, parsed.name);
                } else {
                    currentIndex = 0; // Montevideo, Uruguay
